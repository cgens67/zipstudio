<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZipStudio - Browser IDE & GitHub Sync</title>
    <meta name="description" content="Material 3 Expressive web IDE to import zip projects, edit code with live preview, debug with Gemini reasoning, and synchronize branches and pull requests to GitHub." />
    <meta property="og:title" content="ZipStudio - Browser IDE & GitHub Sync" />
    <meta property="og:description" content="Material 3 Expressive web IDE to import zip projects, edit code with live preview, debug with Gemini reasoning, and synchronize branches and pull requests to GitHub." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Material Symbols Rounded with FILL 1 support -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,1,0..200" />
    <!-- Typography: Roboto, Roboto Flex, JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300..700;1,300..700&family=Roboto+Flex:opsz,wght@8..144,300..700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#121316] text-[#e2e2e6] selection:bg-[#6750a4]/30 selection:text-white antialiased overflow-hidden">
    <div id="root" class="h-screen w-screen overflow-hidden flex flex-col"></div>
    <script>
      // Guard customElements.define to prevent duplicate registration errors (e.g. md-focus-ring)
      if (typeof window !== 'undefined' && window.customElements) {
        const origDefine = window.customElements.define.bind(window.customElements);
        window.customElements.define = function (name, constructor, options) {
          if (!window.customElements.get(name)) {
            try {
              origDefine(name, constructor, options);
            } catch (e) {
              console.warn('Custom element already defined:', name);
            }
          }
        };
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
